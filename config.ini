# Trae 隔离容器配置
# traePath：Trae CN 主程序路径；留空则自动从运行进程/注册表/常见目录探测
traePath=

# rootDir：容器根目录，每个账号一个 account-N 子目录
rootDir=%LOCALAPPDATA%\TraeSandbox

# isolateHome：是否把 USERPROFILE 也指向容器（1=是，0=否）
isolateHome=1

# extensionsDir：启动容器前自动复制到容器扩展目录的扩展文件夹（多个用 ; 分隔）
# 容器扩展目录：<容器根>\account-N\Home\.trae-cn\extensions
extensionsDir=%USERPROFILE%\.trae-cn\extensions\local.trae-auto-checkin-1.0.0
